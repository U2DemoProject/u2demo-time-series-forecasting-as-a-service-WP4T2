[project]
name = "u2demo-deployments"
version = "0.1.0"
description = "Time Series Tool as a Service - Skeleton"
authors = [
    { name = "U2 Demo Team" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (==0.115.12)",
    "uvicorn[standard] (==0.34.0)",
    "pydantic (==2.11.2)",
    "pydantic-settings (==2.8.1)",
    "requests (==2.32.3)",
    "redis (==5.2.1)",
    "rq (==1.16.2)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.8,<0.15.0)",
    "pyright (>=1.1.405,<2.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"
